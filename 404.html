<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Redirect</title>
    <meta name="robots" content="noindex">
    <script src="/config.js" defer></script>
    <script src="/app.js" defer></script>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f7f7f4;
        color: #171717;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
      }

      main {
        width: min(560px, calc(100vw - 40px));
      }

      h1 {
        margin: 0 0 10px;
        font-size: 24px;
        line-height: 1.2;
      }

      p {
        margin: 0 0 18px;
        color: #555;
        line-height: 1.5;
      }

      a {
        color: inherit;
        font-weight: 700;
      }

      .muted {
        font-size: 14px;
        color: #777;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          background: #10100f;
          color: #f4f4f0;
        }

        p {
          color: #c7c7bf;
        }

        .muted {
          color: #99998f;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="headline">Redirect wird geöffnet...</h1>
      <p id="message">Einen Moment bitte.</p>
      <p class="muted" id="fallback"></p>
    </main>
  </body>
</html>
